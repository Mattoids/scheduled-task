<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGradient)" />

  <!-- Decorative circles -->
  <circle cx="128" cy="128" r="64" fill="#ffffff" opacity="0.08" />
  <circle cx="416" cy="384" r="80" fill="#ffffff" opacity="0.06" />

  <!-- Main clock circle -->
  <circle cx="256" cy="256" r="148" fill="#ffffff" opacity="0.95" filter="url(#shadow)" />

  <!-- Clock ticks -->
  <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="132" x2="256" y2="148" />
    <line x1="256" y1="364" x2="256" y2="380" />
    <line x1="132" y1="256" x2="148" y2="256" />
    <line x1="364" y1="256" x2="380" y2="256" />
  </g>

  <!-- Clock hands -->
  <g stroke="url(#accentGradient)" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="172" stroke-width="14" />
    <line x1="256" y1="256" x2="316" y2="296" stroke-width="12" />
  </g>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="url(#accentGradient)" />

  <!-- Task checkmark badge -->
  <circle cx="352" cy="352" r="44" fill="#10b981" filter="url(#shadow)" />
  <path d="M332 352 L346 366 L372 340" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
