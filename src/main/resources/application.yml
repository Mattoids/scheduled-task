server:
  port: 1236

spring:
  application:
    name: scheduled-task
  profiles:
    active: dev
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    placeholder-replacement: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      column-format: "`%s`"

scheduled:
  task:
    aes:
      key: ${SCHEDULED_TASK_AES_KEY:ScheduledTask#01}

report:
  jwt:
    secret: ${JWT_SECRET:scheduled-task-secret-key-change-in-production}
    expiration: 86400000
  upload:
    path: ${user.home}/scheduled-task/uploads
  api:
    key: ${API_KEY:}
  default:
    page-size: 20

logging:
  level:
    # 关闭 sshj StreamCopier 的 ERROR 噪音（隧道强制断开时的正常输出）
    net.schmizz.sshj.common.StreamCopier: OFF
